<!DOCTYPE html>
<html lang='en'>
<head>

  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Contact | Holistic Healing Psychotherapy</title>
  <link rel='preconnect' href='https://fonts.googleapis.com'>
  <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
  <link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap' rel='stylesheet'>
  <link rel='stylesheet' href='styles.css'>
  <link rel='icon' type='image/x-icon' href='/assets/favicon.ico'>
  <link rel='icon' type='image/png' sizes='32x32' href='/assets/favicon-32.png'>
  <link rel='apple-touch-icon' sizes='180x180' href='/assets/apple-touch-icon.png'>
</head>
<body>
  <header class='topbar'>
    <div class='container nav'>
      <a class='brand' href='/'>
        <img class='brand-mark' src='assets/finallofo_nobk.png' alt='Holistic Healing Psychotherapy logo'>
        <span class='brand-text'>Holistic Healing<small>Psychotherapy</small></span>
      </a>
      <button class='menu-toggle' aria-label='Open menu'>Menu</button>
      <nav class='nav-links'>
        <a href='/'>Home</a>
        <a href='/about'>About</a>
        <a href='/approach'>What is Holistic Healing?</a>
        <a href='/services'>Services</a>
        <a href='/specialties'>Specialities</a>
        <a href='/faq'>FAQ</a>
        <a class='btn active' href='/contact'>Contact Us</a>
      </nav>
    </div>
  </header>
  <main id='main-content' data-page='contact'>
    <section class='section compact'>
      <div class='container'>
        <div class='card'>Loading content...</div>
      </div>
    </section>
  </main>
  <form name='contact' method='POST' data-netlify='true' netlify-honeypot='bot-field' hidden>

    <input type='text' name='name'>
    <input type='email' name='email'>
    <input type='text' name='phone'>
    <textarea name='message'></textarea>
  </form>
  <footer class='footer'>
    <div class='container footer-grid'>
      <div><div class='brand'>Holistic Healing<small>Psychotherapy</small></div></div>
      <div><h3>Pages</h3><ul class='list-clean'><li><a href='/approach'>Approach</a></li><li><a href='/services'>Services</a></li></ul></div>
      <div><h3>Contact</h3><ul class='list-clean'><li>info@psychotherapy.care</li><li>(760) 454-7249</li><li>338 Via Vera Cruz, Suite 260, San Marcos, CA 92078</li></ul></div>
    </div>
  </footer>
  <script type='module' src='script.js'></script>
