backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: editorial_workflow

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - name: "home"
        label: "Home"
        file: "content/home.md"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "markdown" }
              - { label: "Primary CTA Text", name: "primaryCtaText", widget: "string" }
              - { label: "Primary CTA Href", name: "primaryCtaHref", widget: "string" }
              - { label: "Secondary CTA Text", name: "secondaryCtaText", widget: "string" }
              - { label: "Secondary CTA Href", name: "secondaryCtaHref", widget: "string" }
          - label: "Marquee Items"
            name: "marquee"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - label: "Welcome Section"
            name: "welcome"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Href", name: "buttonHref", widget: "string" }
              - { label: "Image Source", name: "imageSrc", widget: "string" }
              - { label: "Image Alt", name: "imageAlt", widget: "string" }
          - label: "Approach Intro"
            name: "approachIntro"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Href", name: "buttonHref", widget: "string" }
              - { label: "Image Source", name: "imageSrc", widget: "string" }
              - { label: "Image Alt", name: "imageAlt", widget: "string" }
          - label: "How It Works"
            name: "howItWorks"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Phases"
                name: "phases"
                widget: "list"
                fields:
                  - { label: "Step Label", name: "step", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Services Teaser"
            name: "services"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Note", name: "note", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Reasons Section"
            name: "reasons"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Number", name: "number", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "CTA"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Primary CTA Text", name: "primaryCtaText", widget: "string" }
              - { label: "Primary CTA Href", name: "primaryCtaHref", widget: "string" }
              - { label: "Secondary CTA Text", name: "secondaryCtaText", widget: "string" }
              - { label: "Secondary CTA Href", name: "secondaryCtaHref", widget: "string" }

      - name: "approach"
        label: "Approach"
        file: "content/approach.md"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "markdown", required: false }
              - { label: "Primary CTA Text", name: "primaryCtaText", widget: "string", required: false }
              - { label: "Primary CTA Href", name: "primaryCtaHref", widget: "string", required: false }
          - label: "Section One"
            name: "sectionOne"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown" }
              - { label: "Image Source", name: "imageSrc", widget: "string" }
              - { label: "Image Alt", name: "imageAlt", widget: "string" }
          - label: "Pillars"
            name: "pillars"
            widget: "list"
            required: false
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image Source", name: "imageSrc", widget: "string", required: false }
              - { label: "Image Alt", name: "imageAlt", widget: "string", required: false }
          - label: "Process"
            name: "process"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Step", name: "step", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - { label: "Bottom Note", name: "note", widget: "text" }
          - label: "CTA"
            name: "cta"
            widget: "object"
            required: false
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text", required: false }
              - { label: "Primary CTA Text", name: "primaryCtaText", widget: "string", required: false }
              - { label: "Primary CTA Href", name: "primaryCtaHref", widget: "string", required: false }

      - name: "services"
        label: "Services"
        file: "content/services.md"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
          - label: "Primary Services"
            name: "primaryServices"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Optional Additions"
            name: "optional"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

      - name: "specialties"
        label: "Specialties"
        file: "content/specialties.md"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
          - label: "Specialties List"
            name: "specialties"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "CTA"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Primary CTA Text", name: "primaryCtaText", widget: "string" }
              - { label: "Primary CTA Href", name: "primaryCtaHref", widget: "string" }

      - name: "faq"
        label: "FAQ"
        file: "content/faq.md"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
          - label: "FAQ"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }

      - name: "about"
        label: "About"
        file: "content/about.md"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
          - label: "Bio"
            name: "bio"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown" }
              - label: "Bullets"
                name: "bullets"
                widget: "list"
                field: { label: "Bullet", name: "bullet", widget: "string" }
              - { label: "Image Source", name: "imageSrc", widget: "string" }
              - { label: "Image Alt", name: "imageAlt", widget: "string" }
          - label: "Values"
            name: "values"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      - name: "contact"
        label: "Contact"
        file: "content/contact.md"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
          - label: "Form"
            name: "form"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Name Placeholder", name: "namePlaceholder", widget: "string" }
              - { label: "Email Placeholder", name: "emailPlaceholder", widget: "string" }
              - { label: "Phone Placeholder", name: "phonePlaceholder", widget: "string" }
              - { label: "Message Placeholder", name: "messagePlaceholder", widget: "string" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Form Note", name: "note", widget: "text" }
          - label: "Details"
            name: "details"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
              - { label: "Consultations", name: "consultations", widget: "text" }
